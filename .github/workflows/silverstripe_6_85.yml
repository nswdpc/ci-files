# Bundle workflow
# + PHP 8.5
# + Silverstripe 6
# + Rector phpset: php85
# Contains:
# + rector process
# + php-cs-fixer fix
# Requires
# + suggested Silverstripe rector module to be installed in project (see composer.json)
name: Bundle

on:
  workflow_call: null

jobs:
  bundle:
    uses: ./.github/workflows/_silverstripe_bundle.yml
    with:
      rector-config: .rector.silverstripe_6_85.php
      php-version: '8.5'
