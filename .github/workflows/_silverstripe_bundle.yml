# This based bundle of steps is called by the relevant workflows
# passing in the required parameters
# Provides:
# - rector process
# - php-cs-fixer fix
name: 'Silverstripe Rector + PHPCSFixer bundle (base)'

on:
  workflow_call:
    inputs:
      rector-config:
        description: 'Path, relative to vendor/nswdpc/ci-files/rector, to the rector config for this PHP baseline'
        required: true
        type: string
      php-cs-fixer-config:
        description: 'Path, relative to vendor/nswdpc/ci-files/php-cs-fixer, to the php-cs-fixer config'
        required: false
        type: string
        default: '.php-cs-fixer.php'
      php-version:
        description: 'PHP version the tooling itself runs under'
        required: false
        type: string
        default: '8.5'

jobs:
  bundle:
    name: 'php-cs-fixer and rector'
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      -
        name: 'Prep'
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      -
        name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      -
        name: 'Composer'
        run: |
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.silverstripe/recipe-plugin true
          composer config --no-plugins allow-plugins.silverstripe/vendor-plugin true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer install --ansi --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: "0"

      -
        name: 'Rector (process)'
        # run unless the branch contains this label
        if: ${{ !contains(github.head_ref, 'no-rector') }}
        # config uses base of caller module
        run: vendor/bin/rector process --no-diffs --ansi --config vendor/nswdpc/ci-files/rector/${{ inputs.rector-config }} src tests

      -
        # commit only to core contributors who have repository access
        name: 'Rector (commit)'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '[rector] Automated updates generated by rector configuration'

      -
        name: 'PHP-CS-Fixer (fix)'
        # run unless the branch contains this label
        if: ${{ !contains(github.head_ref, 'no-cs-fix') }}
        # config uses base of caller module
        run: vendor/bin/php-cs-fixer fix --ansi --no-interaction --show-progress=none --config vendor/nswdpc/ci-files/php-cs-fixer/${{ inputs.php-cs-fixer-config }} src tests

      -
        # commit only to core contributors who have repository access
        name: 'PHP-CS-Fixer (commit)'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '[php-cs-fixer] Automated updates generated by php-cs-fixer configuration'
