# This based bundle of steps is called by the relevant workflows
# passing in the required parameters
# Provides:
# - phpstan analyse, run as a matrix across the supplied PHP versions
name: Silverstripe PHPStan (base)

on:
  workflow_call:
    inputs:
      phpstan-config:
        description: 'Path, relative to vendor/nswdpc/ci-files/phpstan, to the PHPStan config for this PHP baseline'
        required: false
        type: string
        default: '.phpstan.silverstripe.neon'
      php-versions:
        description: 'JSON array of PHP versions to run phpstan against, e.g. ["8.3","8.4","8.5"]'
        required: false
        type: string
        default: '["8.3","8.4","8.5"]'

jobs:
  bundle:
    name: 'phpstan (PHP ${{ matrix.php-version }})'
    if: ${{ github.event_name == 'pull_request' && !contains(github.head_ref, 'no-phpstan') }}
    runs-on: ubuntu-latest
    strategy:
      # let every PHP version run and report, don't cancel the rest on first failure
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(inputs.php-versions) }}
    steps:
      -
        name: 'Prep'
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      -
        name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      -
        name: 'Composer'
        run: |
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.silverstripe/recipe-plugin true
          composer config --no-plugins allow-plugins.silverstripe/vendor-plugin true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer install --ansi --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: "0"

      -
        name: 'PHPStan (analyse)'
        # run unless the branch contains this label
        if: ${{ !contains(github.head_ref, 'no-phpstan') }}
        # config uses base of caller module
        run: vendor/bin/phpstan analyse --ansi --no-progress --no-interaction --configuration vendor/nswdpc/ci-files/phpstan/${{ inputs.phpstan-config }}
